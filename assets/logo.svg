<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChessMaster logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gold" x1="150" y1="120" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#D9A100"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1035" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded app-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle board grid in the corner -->
  <g opacity="0.10" fill="#FFFFFF">
    <rect x="40" y="40" width="36" height="36"/>
    <rect x="112" y="40" width="36" height="36"/>
    <rect x="76" y="76" width="36" height="36"/>
    <rect x="40" y="112" width="36" height="36"/>
  </g>

  <!-- knight -->
  <g filter="url(#soft)">
    <path fill="url(#gold)" d="M196 132c-8 14-10 27-8 40-22 16-46 44-54 92-3 18 2 30 14 34 10 3 19-2 25-12 6-10 13-19 24-24-6 16-8 30-8 44 0 8-3 15-9 22-8 9-13 18-13 28h176c0-40-10-70-30-104-16-27-22-49-22-74 0-30-14-54-42-70-13-8-27-12-40-10-4-4-8-8-13-11-2-1-4 1-3 3 3 6 5 12 6 18-10-2-20-2-30 4z"/>
    <circle cx="214" cy="176" r="9" fill="#4C1D95"/>
  </g>

  <!-- base plate -->
  <rect x="150" y="392" width="212" height="26" rx="13" fill="url(#gold)"/>
  <rect x="132" y="424" width="248" height="28" rx="14" fill="url(#gold)"/>
</svg>
