name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify puzzles
        run: npm run verify:puzzles

      - name: Chess logic tests
        run: npm run test:chess
